name: Prepare draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate release gate and package artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - name: Create draft for review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--draft --verify-tag --title "AgentWarmup $RELEASE_TAG" --notes-file .github/release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
